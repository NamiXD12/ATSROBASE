# ─── ASTROBASE — GitHub Pages Deployment ────────────────────────────────────
# Deploys the Vite production build to GitHub Pages on every push to main.
#
# Prerequisites in GitHub repo settings:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Expected URL: https://namixd12.github.io/ASTROBASE/
# ───────────────────────────────────────────────────────────────────────────
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout source code ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── 3. Install dependencies ──
      - name: Install dependencies
        run: npm ci

      # ── 4. Build the production bundle ──
      - name: Build
        run: npm run build

      # ── 5. Create 404.html for SPA routing ──
      # GitHub Pages returns 404.html for unknown paths.
      # Copying index.html → 404.html lets React Router handle all routes.
      - name: Create SPA fallback
        run: cp dist/index.html dist/404.html

      # ── 6. Upload the dist/ folder as a Pages artifact ──
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # ── 7. Deploy to GitHub Pages ──
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
